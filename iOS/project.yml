# Progetto Xcode dell'app per iPhone, generato con XcodeGen:
#   brew install xcodegen      (una volta sola)
#   ./scripts/ios-project.sh   (dalla cartella principale: genera e apre il progetto)
name: OmniToolsiOS
options:
  bundleIdPrefix: app.omnitools
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  OmniTools:
    path: ..
targets:
  OmniToolsiOS:
    type: application
    platform: iOS
    sources: [OmniToolsiOS]
    scheme: {}            # schema condiviso: serve a xcodebuild per l'archivio TestFlight
    dependencies:
      - package: OmniTools
        product: UtilityCore
    settings:
      base:
        PRODUCT_NAME: OmniTools
        PRODUCT_BUNDLE_IDENTIFIER: app.omnitools.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${OMNITOOLS_TEAM}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OmniTools
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "OmniTools legge le miniature delle tue foto per trovare doppioni e foto simili. Nessuna foto viene eliminata senza la tua conferma."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        # Nessuna crittografia propria: evita la domanda sull'esportazione a ogni build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
